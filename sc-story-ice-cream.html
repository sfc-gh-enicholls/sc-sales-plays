<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Why Supply Chain Is Hard</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --navy:#042130;--mid:#11567F;--blue:#249EDC;--teal:#71D3DC;
  --erp:#6366f1;--plan:#8b5cf6;--wms:#f97316;--tms:#eab308;
  --edi:#22c55e;--cold:#0d9488;--bi:#06b6d4;
}
*{box-sizing:border-box;margin:0;padding:0;}
html,body{width:100%;height:100%;font-family:'Inter',sans-serif;background:#FAFAF9;overflow:hidden;}

/* ── SHELL ── */
.slide{position:absolute;inset:0;display:grid;grid-template-rows:1fr auto auto;
  opacity:0;transition:opacity .4s ease;pointer-events:none;}
.slide.on{opacity:1;pointer-events:all;}

/* ── VIZ AREA ── */
.viz{display:flex;align-items:center;justify-content:center;
  padding:1.5rem 2rem;overflow:hidden;position:relative;}

/* ── CAPTION ── */
.cap{padding:.65rem 2rem .75rem;background:#fff;border-top:1px solid rgba(0,0,0,.07);min-height:80px;}
.cap.dark{background:var(--navy);}
.cap-label{font-size:.58rem;font-weight:700;letter-spacing:.22em;text-transform:uppercase;
  color:var(--blue);margin-bottom:.22rem;}
.cap.dark .cap-label{color:var(--teal);}
.cap-h{font-size:clamp(.9rem,1.7vw,1.2rem);font-weight:800;color:var(--navy);
  letter-spacing:-.014em;line-height:1.2;margin-bottom:.18rem;}
.cap.dark .cap-h{color:#fff;}
.cap-p{font-size:clamp(.7rem,1.1vw,.84rem);color:#4B5568;line-height:1.6;font-weight:300;}
.cap.dark .cap-p{color:#CBD5E0;}
.cap-p strong{color:var(--navy);font-weight:700;}
.cap.dark .cap-p strong{color:#fff;}
.cap-p em{color:var(--mid);font-style:normal;font-weight:600;}

/* ── FOOTER ── */
.foot{height:50px;background:#fff;border-top:1px solid rgba(0,0,0,.07);
  display:flex;align-items:center;justify-content:center;gap:.8rem;padding:0 1.5rem;}
.foot.dark{background:#0a1e2c;border-top-color:rgba(255,255,255,.08);}
.btn{background:var(--navy);color:#fff;border:none;border-radius:999px;
  padding:.36rem 1.15rem;font-size:.72rem;font-weight:700;cursor:pointer;
  font-family:'Inter',sans-serif;letter-spacing:.04em;transition:all .18s;}
.btn:hover{background:var(--mid);}
.btn.sec{background:transparent;color:var(--navy);border:1.5px solid rgba(0,0,0,.2);}
.btn.sec:hover{background:#F3F4F6;}
.btn:disabled{opacity:.25;cursor:default;}
.foot.dark .btn.sec{color:#CBD5E0;border-color:rgba(255,255,255,.2);}
.foot.dark .btn.sec:hover{background:rgba(255,255,255,.07);}
.ctr-txt{font-size:.67rem;font-weight:600;color:#9CA3AF;letter-spacing:.05em;min-width:3.8rem;text-align:center;}
.foot.dark .ctr-txt{color:#64748b;}
.dots-row{display:flex;gap:.28rem;align-items:center;}
.dot{width:6px;height:6px;border-radius:50%;background:rgba(0,0,0,.14);cursor:pointer;transition:all .2s;}
.dot.on{background:var(--mid);transform:scale(1.4);}
.foot.dark .dot{background:rgba(255,255,255,.18);}
.foot.dark .dot.on{background:var(--teal);}

/* ── NODE components (HTML, not SVG) ── */
.chain-node{
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:.25rem;border-radius:13px;border-width:2px;border-style:solid;
  text-align:center;font-family:'Inter',sans-serif;
  animation:fadeUp .4s ease both;
}
.chain-node .ic{font-family:serif;line-height:1;}
.chain-node .lb{font-weight:700;line-height:1.2;}
.chain-node .sub{color:#9CA3AF;line-height:1.2;}
.chain-node.lg{padding:.9rem 1.4rem;min-width:130px;}
.chain-node.lg .ic{font-size:2rem;}
.chain-node.lg .lb{font-size:1rem;}
.chain-node.md{padding:.55rem 1rem;min-width:105px;}
.chain-node.md .ic{font-size:1.4rem;}
.chain-node.md .lb{font-size:.82rem;}
.chain-node.md .sub{font-size:.68rem;}
.chain-node.sm{padding:.42rem .8rem;min-width:86px;}
.chain-node.sm .ic{font-size:1.1rem;}
.chain-node.sm .lb{font-size:.76rem;}
.chain-node.sm .sub{font-size:.65rem;}

/* Arrow connector */
.arr{display:flex;align-items:center;padding:0 .3rem;animation:fadeUp .4s ease both;}
.arr-line{position:relative;height:2px;width:36px;}
.arr-solid .arr-line{background:#CBD5E0;}
.arr-dashed .arr-line{background:none;border-top:2px dashed #F59E0B;}
.arr-line::after{content:'';position:absolute;right:-5px;top:-5px;
  width:0;height:0;border:5px solid transparent;}
.arr-solid .arr-line::after{border-left-color:#CBD5E0;}
.arr-dashed .arr-line::after{border-left-color:#F59E0B;}

/* Badge pill */
.badge{display:inline-flex;align-items:center;border-radius:999px;border-width:1.3px;
  border-style:solid;padding:.18rem .65rem;font-size:.72rem;font-weight:700;
  font-family:'Inter',sans-serif;letter-spacing:.04em;white-space:nowrap;
  animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both;}

/* Callout box */
.callout{border-radius:10px;border-width:1.3px;border-style:solid;
  padding:.42rem .75rem;font-family:'Inter',sans-serif;
  animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both;}
.callout .c-h{font-size:.82rem;font-weight:700;line-height:1.3;}
.callout .c-s{font-size:.72rem;opacity:.8;margin-top:.1rem;line-height:1.3;}

/* Layout helpers */
.row{display:flex;align-items:center;gap:.7rem;}
.col{display:flex;flex-direction:column;gap:.5rem;}
.col-tight{display:flex;flex-direction:column;gap:.35rem;}
.ctr{display:flex;align-items:center;justify-content:center;width:100%;}

/* Definition grid */
.def-grid{display:grid;grid-template-columns:1fr 1fr;grid-template-rows:1fr 1fr;
  gap:1rem;width:100%;height:100%;padding:.5rem;}
.def-card{border-radius:18px;display:flex;flex-direction:column;align-items:center;
  justify-content:center;gap:.4rem;border-width:2px;border-style:solid;
  animation:popIn .5s cubic-bezier(.34,1.56,.64,1) both;}
.def-card .big{font-size:clamp(2.5rem,5vw,4.5rem);font-weight:900;letter-spacing:-.03em;line-height:1;}
.def-card .tag{font-size:clamp(.7rem,1.2vw,.95rem);font-weight:700;letter-spacing:.15em;
  text-transform:uppercase;opacity:.65;}

/* B&J infographic supply chain map */
.bj{display:flex;flex-direction:column;width:100%;gap:.42rem;}
.bj-row{display:flex;align-items:stretch;gap:0;width:100%;}
.bj-stage{flex:1;display:flex;flex-direction:column;border-width:1.8px;border-style:solid;
  border-radius:14px;overflow:hidden;animation:fadeUp .45s ease both;}
.bj-top{padding:.55rem .65rem .4rem;display:flex;flex-direction:column;gap:.28rem;flex:1;}
.bj-icon-row{display:flex;align-items:center;gap:.45rem;}
.bj-circle{width:38px;height:38px;border-radius:50%;display:flex;align-items:center;
  justify-content:center;font-size:1.35rem;font-family:serif;flex-shrink:0;
  border-width:1.5px;border-style:solid;}
.bj-stage-name{font-weight:800;font-size:.77rem;font-family:'Inter',sans-serif;
  letter-spacing:-.01em;line-height:1.2;}
.bj-facts{display:flex;flex-direction:column;gap:.13rem;}
.bj-fact{font-size:.66rem;color:#4B5568;font-family:'Inter',sans-serif;line-height:1.3;
  display:flex;align-items:baseline;gap:.2rem;}
.bj-sys-zone{padding:.38rem .6rem;border-top-width:1px;border-top-style:dashed;
  border-top-color:rgba(0,0,0,.1);background:rgba(255,255,255,.55);}
.bj-sys-lbl{font-size:.55rem;font-weight:700;letter-spacing:.1em;text-transform:uppercase;
  opacity:.55;font-family:'Inter',sans-serif;margin-bottom:.22rem;}
.bj-sys-pills{display:flex;flex-wrap:wrap;gap:.18rem;}
.bj-pill{font-size:.62rem;font-weight:700;font-family:'Inter',sans-serif;
  border-radius:999px;padding:.1rem .44rem;border-width:1.1px;border-style:solid;
  white-space:nowrap;animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both;}
/* Connectors between stages */
.bj-conn{display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:0 .18rem;flex-shrink:0;gap:.1rem;}
.bj-conn-icon{font-size:1rem;font-family:serif;}
.bj-conn-line{width:1.5px;height:20px;background:#E5E7EB;}
/* Cold bar & stats */
.bj-cold{display:flex;align-items:center;justify-content:center;gap:.5rem;
  padding:.3rem 1rem;background:#0d948812;border:1.2px solid #0d9488;border-radius:8px;
  font-size:.71rem;font-weight:700;color:#0d9488;font-family:'Inter',sans-serif;
  animation:fadeUp .4s ease 1s both;letter-spacing:.01em;}
.bj-stats{display:flex;gap:.45rem;justify-content:center;flex-wrap:wrap;
  animation:fadeUp .4s ease 1.2s both;}
.bj-stat{font-size:.68rem;font-weight:700;color:#fff;background:rgba(4,33,48,.88);
  border-radius:999px;padding:.18rem .65rem;font-family:'Inter',sans-serif;white-space:nowrap;}

/* Silo slide */
.silo-grid{display:grid;grid-template-columns:repeat(5,1fr);
  grid-template-rows:1fr 1fr;gap:.55rem;width:100%;height:100%;padding:.5rem;}
.silo-card{border-radius:13px;border-width:1.8px;border-style:solid;
  display:flex;flex-direction:column;gap:.3rem;padding:.5rem .55rem;
  animation:fadeUp .45s ease both;overflow:hidden;}
.silo-card.wide{grid-column:span 2;}
.silo-card .s-head{font-size:.68rem;font-weight:700;letter-spacing:.06em;
  text-transform:uppercase;font-family:'Inter',sans-serif;padding-bottom:.2rem;
  border-bottom-width:1px;border-bottom-style:solid;opacity:.9;}
.silo-item{border-radius:6px;border-width:1px;border-style:solid;
  padding:.22rem .45rem;font-size:.76rem;font-weight:600;font-family:'Inter',sans-serif;}
.cut{display:flex;align-items:center;justify-content:center;
  color:#EF4444;font-weight:900;font-size:.9rem;font-family:'Inter',sans-serif;
  position:relative;animation:popIn .4s cubic-bezier(.34,1.56,.64,1) both;}

/* Animations */
@keyframes fadeUp{from{opacity:0;transform:translateY(9px);}to{opacity:1;transform:translateY(0);}}
@keyframes popIn{0%{opacity:0;transform:scale(.55);}70%{transform:scale(1.07);}100%{opacity:1;transform:scale(1);}}
</style>
</head>
<body>

<!-- ════ SLIDE 1: Build ════ -->
<div class="slide on" id="s1">
  <div class="viz" id="viz1"></div>
  <div class="cap" id="cap1">
    <div class="cap-label" id="clabel"></div>
    <div class="cap-h" id="cheading"></div>
    <div class="cap-p" id="cbody"></div>
  </div>
  <div class="foot" id="foot1">
    <button class="btn sec" id="btnB" onclick="prev()" disabled>← Back</button>
    <div class="dots-row" id="dotrow"></div>
    <span class="ctr-txt" id="ctrtxt">Step 0 of 6</span>
    <button class="btn" id="btnN" onclick="next()">Next →</button>
  </div>
</div>

<!-- ════ SLIDE 2: Silos ════ -->
<div class="slide" id="s2">
  <div class="viz" id="viz2"></div>
  <div class="cap dark">
    <div class="cap-label">THE PROBLEM</div>
    <div class="cap-h">Nobody designed this. It accumulated.</div>
    <div class="cap-p">Every one of those systems was a <strong>perfectly sensible decision</strong> made by a sensible person solving a real problem at a real moment in time. <strong>None of them talk to each other.</strong> That is why supply chain is hard.</div>
  </div>
  <div class="foot dark">
    <button class="btn sec" onclick="toS1()">← Start again</button>
  </div>
</div>

<script>
/* ─── ELEMENT BUILDERS ─── */
function N(icon, label, sub, c, size, delay) {
  // size: 'lg' | 'md' | 'sm'
  const d = document.createElement('div');
  d.className = `chain-node ${size||'md'}`;
  d.style.cssText = `border-color:${c};background:${c}18;animation-delay:${delay||0}ms`;
  if (icon) { const s=document.createElement('span'); s.className='ic'; s.textContent=icon; d.appendChild(s); }
  const lb=document.createElement('span'); lb.className='lb'; lb.style.color=c; lb.textContent=label; d.appendChild(lb);
  if (sub) { const sb=document.createElement('span'); sb.className='sub'; sb.style.fontSize='.68rem'; sb.textContent=sub; d.appendChild(sb); }
  return d;
}
function A(dashed, delay) {
  const d=document.createElement('div'); d.className=`arr arr-${dashed?'dashed':'solid'}`;
  d.style.animationDelay=`${delay||0}ms`;
  const l=document.createElement('div'); l.className='arr-line'; d.appendChild(l); return d;
}
function B(text, c, delay) {
  const d=document.createElement('span'); d.className='badge';
  d.style.cssText=`border-color:${c};background:${c}1A;color:${c};animation-delay:${delay||0}ms`;
  d.textContent=text; return d;
}
function CO(h, s, c, delay) {
  const d=document.createElement('div'); d.className='callout';
  d.style.cssText=`border-color:${c};background:${c}18;animation-delay:${delay||0}ms`;
  const dh=document.createElement('div'); dh.className='c-h'; dh.style.color=c; dh.textContent=h; d.appendChild(dh);
  if(s){ const ds=document.createElement('div'); ds.className='c-s'; ds.style.color=c; ds.textContent=s; d.appendChild(ds); }
  return d;
}
function ROW(...items){ const d=document.createElement('div'); d.className='row'; items.forEach(i=>i&&d.appendChild(i)); return d; }
function COL(...items){ const d=document.createElement('div'); d.className='col'; items.forEach(i=>i&&d.appendChild(i)); return d; }
function CTR(child){ const d=document.createElement('div'); d.className='ctr'; d.appendChild(child); return d; }

/* ─── STEP RENDERS ─── */
function S0(viz) {
  const grid = document.createElement('div'); grid.className='def-grid';
  grid.style.cssText='width:100%;height:100%;';
  [
    {label:'Right Product', color:'#8b5cf6', delay:0},
    {label:'Right Place',   color:'#0d9488', delay:100},
    {label:'Right Time',    color:'#f97316', delay:200},
    {label:'Right Price',   color:'#22c55e', delay:300},
  ].forEach(it=>{
    const c=document.createElement('div'); c.className='def-card';
    c.style.cssText=`border-color:${it.color};background:${it.color}12;animation-delay:${it.delay}ms`;
    const words=it.label.split(' ');
    const big=document.createElement('div'); big.className='big'; big.style.color=it.color; big.textContent=words[0]; c.appendChild(big);
    const tag=document.createElement('div'); tag.className='tag'; tag.style.color=it.color; tag.textContent=words[1]; c.appendChild(tag);
    grid.appendChild(c);
  });
  viz.appendChild(grid);
}

function S1(viz) {
  viz.appendChild(CTR(ROW(
    N('🧁','MAKE IT',  null, '#249EDC','lg',0),
    A(false,350),
    N('🚐','MOVE IT',  null, '#11567F','lg',200),
    A(false,600),
    N('😊','SELL IT',  null, '#22c55e','lg',400),
  )));
}

function S2(viz) {
  const routes = COL(
    ROW(N('🚐','Van 1',null,'#11567F','md',280), A(false,400), N('🌳','Park',  null,'#374151','sm',450)),
    ROW(N('🚐','Van 2',null,'#11567F','md',360), A(false,480), N('🏙️','Town',  null,'#374151','sm',530)),
    ROW(N('🚐','Van 3',null,'#11567F','md',440), A(false,560), N('🏖️','Beach', null,'#374151','sm',610)),
  );
  const left = COL(
    N('🏭','Workshop',null,'#249EDC','md',0),
    B('📊 Spreadsheet (first system)','#6366f1',700),
  );
  viz.appendChild(CTR(ROW(left, A(false,180), routes)));
}

function S3(viz) {
  const routes = COL(
    ROW(N('🚐','Van 1',null,'#11567F','md',200), A(false,300), N('🌳','Park',  null,'#374151','sm',360)),
    ROW(N('🚐','Van 2',null,'#11567F','md',260), A(false,360), N('🏙️','Town',  null,'#374151','sm',420)),
    ROW(N('🚐','Van 3',null,'#11567F','md',320), A(false,420), N('🏖️','Beach', null,'#374151','sm',480)),
    ROW(A(true,560),  N('☕','Café channel',null,'#D97706','sm',600),
        CO('⚠ Flying blind','No visibility into stock','#D97706',750)),
  );
  const left = COL(
    N('🏭','Workshop',null,'#249EDC','md',0),
    B('📊 Spreadsheet','#6366f1',500),
  );
  viz.appendChild(CTR(ROW(left, A(false,120), routes)));
}

function S4(viz) {
  const ings = COL(
    N('🌿','Vanilla',  'Madagascar','#8b5cf6','sm',0),
    N('🍫','Cocoa',    'Ghana',     '#8b5cf6','sm',80),
    N('🥛','Cream',    'UK Farms',  '#8b5cf6','sm',160),
  );
  const dests = COL(
    ROW(N('🌳','Park',  null,'#374151','sm',820), ),
    ROW(N('🏙️','Town',  null,'#374151','sm',880), ),
    ROW(N('🏖️','Beach', null,'#374151','sm',940), ),
    ROW(A(true, 960), N('☕','Café',null,'#D97706','sm',1000)),
  );
  const mfg = COL(
    N('🏭','Manufacturer',null,'#8b5cf6','md',320),
    CO('⏱ 3-week lead time','Must forecast before demand','#8b5cf6',500),
  );
  const dc = COL(
    N('📦','Distribution',null,'#11567F','md',550),
    B('📊 Demand Planning','#8b5cf6',700),
  );
  viz.appendChild(CTR(ROW(ings, A(false,240), mfg, A(false,620), dc, A(false,750), dests)));
}

function S5(viz) {
  const ings = COL(
    N('🌿','Vanilla',  'Madagascar','#8b5cf6','sm',0),
    N('🍫','Cocoa',    'Ghana',     '#8b5cf6','sm',70),
    N('🥛','Cream',    'UK Farms',  '#8b5cf6','sm',140),
  );
  const retailers = COL(
    N('🛒','Tesco',       null,'#15803d','sm',760),
    N('🛒','Sainsbury\'s',null,'#16a34a','sm',820),
    N('🛒','Waitrose',    null,'#166534','sm',880),
    N('🛒','Asda',        null,'#14532d','sm',940),
    A(true,960), 
  );
  const mfg = COL(
    N('🏭','Manufacturer',null,'#8b5cf6','md',270),
    B('ERP','#6366f1',450),
  );
  const dc = COL(
    N('📦','Distribution',null,'#11567F','md',510),
    B('WMS','#f97316',640), B('TMS','#eab308',680),
  );
  const edi = COL(
    CO('⏱ EDI orders: 48 hrs stale','Format from the 1970s','#F59E0B',950),
  );
  viz.appendChild(CTR(ROW(ings, A(false,200), mfg, A(false,580), dc, A(false,710), retailers, edi)));
}

function S6(viz) {
  // B&J supply chain infographic — physical stages + IT systems overlay
  const stages = [
    {
      icon:'🌍', name:'Global Ingredient Sourcing', color:'#8b5cf6',
      conn:{icon:'🚢',label:'3–6 month sea freight'},
      facts:[
        {f:'🇲🇬',t:'Vanilla — Madagascar'},
        {f:'🇬🇭',t:'Cocoa — Ghana'},
        {f:'🇹🇷',t:'Hazelnuts — Turkey'},
        {f:'🇺🇸',t:'Cream — Vermont farms'},
        {f:'🇬🇧',t:'Cream — UK dairy'},
      ],
      sys:[{l:'Coupa',c:'#a855f7'},{l:'SAP Ariba',c:'#6366f1'},
           {l:'Supplier Portal',c:'#a855f7'},{l:'3–6 mo. lead times ⚠',c:'#F59E0B'}],
      delay:0
    },
    {
      icon:'🏭', name:'Manufacturing', color:'#ec4899',
      conn:{icon:'🚛❄️',label:'Refrigerated road freight'},
      facts:[
        {f:'🇺🇸',t:'Waterbury, Vermont (HQ)'},
        {f:'🇳🇱',t:'Hellendoorn, Netherlands'},
        {f:'',t:'60+ flavours per range'},
        {f:'',t:'Fairtrade & non-GMO'},
        {f:'',t:'Seasonal demand spikes'},
      ],
      sys:[{l:'SAP S/4HANA',c:'#6366f1'},{l:'Infor M3 (legacy)',c:'#6366f1'},
           {l:'MES/Opcenter',c:'#ec4899'},{l:'QMS',c:'#ec4899'},{l:'PLM',c:'#ec4899'}],
      delay:160
    },
    {
      icon:'❄️', name:'Cold Chain & Distribution', color:'#0d9488',
      conn:{icon:'🚛',label:'Last-mile cold delivery'},
      facts:[
        {f:'🇺🇸',t:'US East & West DCs'},
        {f:'🇳🇱',t:'EU DC — Netherlands'},
        {f:'🇸🇬',t:'Asia DC — Singapore'},
        {f:'',t:'3PLs in 35 countries'},
        {f:'',t:'–18°C end-to-end required'},
      ],
      sys:[{l:'Blue Yonder WMS',c:'#f97316'},{l:'Manhattan WMS',c:'#f97316'},
           {l:'IoT Temp Sensors',c:'#0d9488'},{l:'TMS ×3 vendors',c:'#eab308'},{l:'3PL Portal',c:'#0d9488'}],
      delay:320
    },
    {
      icon:'🛒', name:'Retail, Scoop Shops & DTC', color:'#22c55e',
      conn:null,
      facts:[
        {f:'🌍',t:'35 countries'},
        {f:'',t:'50,000+ retail stores'},
        {f:'',t:'1,000+ scoop shops'},
        {f:'',t:'DTC & e-commerce'},
        {f:'',t:'POS data: 48-hr lag ⚠'},
      ],
      sys:[{l:'EDI ×8 variants',c:'#22c55e'},{l:'Order Mgmt',c:'#22c55e'},
           {l:'POS data feeds',c:'#22c55e'},{l:'Retail Analytics',c:'#06b6d4'}],
      delay:480
    },
  ];

  const wrap=document.createElement('div'); wrap.className='bj';

  // Stage row
  const row=document.createElement('div'); row.className='bj-row';

  stages.forEach((s,i)=>{
    // Stage card
    const card=document.createElement('div'); card.className='bj-stage';
    card.style.cssText=`border-color:${s.color};background:${s.color}0E;animation-delay:${s.delay}ms`;

    // Top: icon circle + name
    const top=document.createElement('div'); top.className='bj-top';
    const ir=document.createElement('div'); ir.className='bj-icon-row';
    const circ=document.createElement('div'); circ.className='bj-circle';
    circ.style.cssText=`border-color:${s.color};background:${s.color}22;`;
    circ.textContent=s.icon; ir.appendChild(circ);
    const nm=document.createElement('div'); nm.className='bj-stage-name';
    nm.style.color=s.color; nm.textContent=s.name; ir.appendChild(nm);
    top.appendChild(ir);

    // Facts
    const facts=document.createElement('div'); facts.className='bj-facts';
    s.facts.forEach(({f,t})=>{
      const li=document.createElement('div'); li.className='bj-fact';
      if(f){const sp=document.createElement('span');sp.textContent=f;li.appendChild(sp);}
      const tx=document.createElement('span');tx.textContent=t;li.appendChild(tx);
      facts.appendChild(li);
    });
    top.appendChild(facts);
    card.appendChild(top);

    // Systems zone
    const sz=document.createElement('div'); sz.className='bj-sys-zone';
    sz.style.borderTopColor=s.color+'30';
    const slbl=document.createElement('div'); slbl.className='bj-sys-lbl';
    slbl.style.color=s.color; slbl.textContent='IT Systems'; sz.appendChild(slbl);
    const pills=document.createElement('div'); pills.className='bj-sys-pills';
    s.sys.forEach(({l,c},pi)=>{
      const b=document.createElement('span'); b.className='bj-pill';
      b.style.cssText=`border-color:${c};background:${c}1A;color:${c};animation-delay:${s.delay+550+pi*60}ms`;
      b.textContent=l; pills.appendChild(b);
    });
    sz.appendChild(pills); card.appendChild(sz);
    row.appendChild(card);

    // Connector to next stage
    if(s.conn){
      const conn=document.createElement('div'); conn.className='bj-conn';
      const ci=document.createElement('div'); ci.className='bj-conn-icon'; ci.textContent=s.conn.icon; conn.appendChild(ci);
      const cl=document.createElement('div'); cl.className='bj-conn-line'; conn.appendChild(cl);
      row.appendChild(conn);
    }
  });
  wrap.appendChild(row);

  // Cold chain bar
  const cold=document.createElement('div'); cold.className='bj-cold';
  cold.innerHTML='❄️  <strong>Cold chain required throughout: –18°C from Vermont factory to freezer shelf in Tokyo</strong>';
  wrap.appendChild(cold);

  // Stats
  const stats=document.createElement('div'); stats.className='bj-stats';
  ['60+ flavours','50,000 stores','35 countries','5 ERPs','4-continent cold chain']
    .forEach((label,i)=>{
      const chip=document.createElement('span'); chip.className='bj-stat';
      chip.style.cssText=`animation:fadeUp .4s ease ${1300+i*80}ms both`;
      chip.textContent=label; stats.appendChild(chip);
    });
  wrap.appendChild(stats);

  viz.appendChild(wrap);
}

const STEPS = [
  {label:'THE CONCEPT · Step 0 of 6',h:'Supply chain has the most deceptively simple definition in business',
   p:'Four words. Simple enough to fit on a Post-it note. Complicated enough to occupy an entire industry.',
   dark:false, fn:S0},
  {label:'STEP 1 OF 6 · The ice cream van',h:'Make it. Move it. Sell it.',
   p:'One person. One van. <strong>The entire supply chain fits in one person\'s head.</strong> If you\'re running low on vanilla, you nip to the shops. It works perfectly.',
   dark:false, fn:S1},
  {label:'STEP 2 OF 6 · Scaling up',h:'You sell out every day. So you scale up.',
   p:'Three vans. Three routes. You need to track who has what. <strong>You build a spreadsheet — your first \'system\'.</strong> Totally sensible.',
   dark:false, fn:S2},
  {label:'STEP 3 OF 6 · First blind spot',h:'Local cafés want to stock you.',
   p:'Great for volume. But now someone else is holding your product. <strong>You can\'t see how much they have left.</strong> They send a handwritten order once a week. You\'re already flying blind at the shelf.',

   p:'60 flavours. 50,000 stores. 35 countries. <strong>Five ERPs from Unilever acquisitions.</strong> Cold chain from Vermont to Tokyo. Nobody designed this. <strong>It accumulated.</strong>',
   dark:true, fn:S6},
];

/* ─── STATE ─── */
let cur = 0;

function render(n) {
  const viz = document.getElementById('viz1');
  // Fade out, swap, fade in
  viz.style.opacity = '0';
  viz.style.transition = 'opacity .2s ease';
  setTimeout(()=>{
    viz.innerHTML = '';
    STEPS[n].fn(viz);
    viz.style.opacity = '1';
  }, 200);

  const s = STEPS[n];
  document.getElementById('clabel').textContent = s.label;
  document.getElementById('cheading').textContent = s.h;
  document.getElementById('cbody').innerHTML = s.p;
  document.getElementById('cap1').className = 'cap' + (s.dark?' dark':'');
  document.getElementById('foot1').className = 'foot' + (s.dark?' dark':'');
  document.getElementById('btnB').disabled = n === 0;
  const isLast = n === STEPS.length - 1;
  const bn = document.getElementById('btnN');
  bn.textContent = isLast ? 'See what this creates →' : 'Next →';
  bn.onclick = isLast ? toS2 : next;
  document.getElementById('ctrtxt').textContent = `Step ${n} of 6`;
  const dr = document.getElementById('dotrow');
  dr.innerHTML = '';
  STEPS.forEach((_,i)=>{
    const d = document.createElement('div'); d.className='dot'+(i===n?' on':'');
    d.onclick = ()=>{ cur=i; render(i); }; dr.appendChild(d);
  });
}

function next(){ if(cur<STEPS.length-1){cur++;render(cur);} }
function prev(){ if(cur>0){cur--;render(cur);} }
function toS2(){ document.getElementById('s1').classList.remove('on'); document.getElementById('s2').classList.add('on'); }
function toS1(){ document.getElementById('s2').classList.remove('on'); document.getElementById('s1').classList.add('on'); cur=0;render(0); }

document.addEventListener('keydown',e=>{
  const on2=document.getElementById('s2').classList.contains('on');
  if(on2){if(e.key==='ArrowLeft')toS1();return;}
  if(e.key==='ArrowRight'||e.key===' '){e.preventDefault();next();}
  if(e.key==='ArrowLeft'){e.preventDefault();prev();}
});

  for(let i=0;i<4;i++){

render(0);
